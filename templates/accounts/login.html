{% extends "base.html" %}
{% block title %}Login - Schemz{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6 text-center">Login</h2>

        {% if form.errors %}
        <div class="bg-red-100 text-red-700 border border-red-300 rounded-lg p-3 mb-4">
            <p>Invalid username or password. Please try again.</p>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Username</label>
                {{ form.username }}
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Password</label>
                {{ form.password }}
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">
                Login
            </button>
        </form>

        <p class="text-center text-gray-600 dark:text-gray-400 mt-4">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-indigo-600 dark:text-indigo-400 hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
